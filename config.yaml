# Konfigurasi secteam
ollama:
  base_url: http://localhost:11434
  temperature: 0.2
  num_ctx: 16384        
  num_predict: 2048     # had token keluaran setiap panggilan (elak gelung ulangan)
  repeat_penalty: 1.1
  keep_alive: 30m

models:
  default: qwen2.5:7b
  supervisor: qwen2.5:7b   # Leader (orkestrasi/routing)
  reporter: qwen2.5:7b     # Leader (penulisan laporan)
  spy: qwen2.5:7b          # Perisik
  analyst: qwen2.5:7b      # Penyelidik kerentanan
  operator: qwen2.5:7b     # Exploit operator

# Memori skill: setiap pakar bina "playbook" teknik boleh guna semula yang berkembang antara run.
# Hanya TEKNIK generalisasi disimpan (bukan fakta/data klien); skill relevan disuntik ke tugasan baru.
memory:
  enabled: true
  dir: memory
  recall_k: 3          # bil. skill disuntik ke prompt pakar
  max_per_agent: 60    # had skill setiap pakar (yang jarang guna dibuang bila penuh)
  reflect: true        # ekstrak skill selepas tugasan pakar (1 panggilan model tambahan; set false untuk laju)

orchestration:
  max_steps: 8              # bilangan maksimum tugasan yang supervisor boleh agih
  max_tool_rounds: 12       # bilangan maksimum pusingan alat setiap agent setiap tugasan
  max_calls_per_agent: 2    # pengawal gelung: had tugasan untuk setiap pakar
  max_parallel_tool_calls: 4  # had panggilan alat serentak setiap giliran model (elak ribut panggilan)
  max_tool_output_chars: 6000

report_language: "Bahasa Melayu Malaysia (BUKAN Bahasa Indonesia: guna 'keselamatan' bukan 'keamanan', 'boleh' bukan 'dapat', 'peranti' bukan 'perangkat'). Istilah teknikal boleh kekal dalam English"

semgrep_configs:
  - p/default

paths:
  reports: reports
  logs: logs
  sandbox: workspace/sandbox
